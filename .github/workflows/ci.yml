name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Build, Validate Compose & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Validate Docker Compose Syntax
        run: |
          echo "Validating docker-compose.yml configuration syntax..."
          docker compose config --quiet
          echo "docker-compose.yml validation successful."

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Maven Build & Comprehensive Verification
        run: |
          ./mvnw clean verify -B \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
