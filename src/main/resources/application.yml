# ─────────────────────────────────────────────────────────────
# ThreadTrace — Garment Supply-Chain Traceability & DPP
# ─────────────────────────────────────────────────────────────

spring:
  application:
    name: threadtrace

  # ── DataSource (env-var placeholders, no hardcoded secrets) ──
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:threadtrace}
    username: ${DB_USERNAME:threadtrace}
    password: ${DB_PASSWORD:threadtrace}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # ── JPA ──
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Cache (Caffeine) ──
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  # ── Spring Batch ──
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  # ── Security defaults (override via env) ──
  security:
    user:
      name: ${SECURITY_USER:admin}
      password: ${SECURITY_PASSWORD:admin}

# ─────────────────────────────────────────────────────────────
# ThreadTrace domain configuration
# ─────────────────────────────────────────────────────────────
threadtrace:
  process-steps:
    RECEIVE:
      label: "Receive Raw Material"
      max-loss-percentage: 2.0
    CUT:
      label: "Cut Fabric"
      max-loss-percentage: 12.0
    SEW:
      label: "Sew Garment"
      max-loss-percentage: 3.0
    WASH:
      label: "Wash"
      max-loss-percentage: 1.5
    DYE:
      label: "Dye"
      max-loss-percentage: 2.0
    FINISH:
      label: "Finish"
      max-loss-percentage: 1.0
    PACK:
      label: "Pack"
      max-loss-percentage: 0.5
    SHIP:
      label: "Ship"
      max-loss-percentage: 0.5

  valid-certificate-types:
    - GOTS
    - OEKO_TEX
    - FAIR_TRADE
    - BCI
    - GRS

  emission-factors:
    water-liters-per-unit: 2700.0
    energy-kwh-per-unit: 15.5
    co2e-kg-per-unit: 8.3

  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:threadtrace}

# ─────────────────────────────────────────────────────────────
# Actuator — health/readiness probes + Prometheus
# ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

# ─────────────────────────────────────────────────────────────
# Structured JSON logging with trace IDs
# ─────────────────────────────────────────────────────────────
logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSZ}","level":"%level","traceId":"%X{traceId:-none}","spanId":"%X{spanId:-none}","logger":"%logger{36}","message":"%msg"}%n'

# ─────────────────────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# ─────────────────────────────────────────────────────────────
# SpringDoc / OpenAPI
# ─────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
