spring:
  datasource:
    url: jdbc:h2:mem:threadtrace;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  batch:
    jdbc:
      initialize-schema: always

threadtrace:
  process-steps:
    RECEIVE:
      label: "Receive Raw Material"
      max-loss-percentage: 2.0
    CUT:
      label: "Cut Fabric"
      max-loss-percentage: 12.0
    SEW:
      label: "Sew Garment"
      max-loss-percentage: 3.0
    WASH:
      label: "Wash"
      max-loss-percentage: 1.5
    DYE:
      label: "Dye"
      max-loss-percentage: 2.0
    FINISH:
      label: "Finish"
      max-loss-percentage: 1.0
    PACK:
      label: "Pack"
      max-loss-percentage: 0.5
    SHIP:
      label: "Ship"
      max-loss-percentage: 0.5
  valid-certificate-types:
    - GOTS
    - OEKO_TEX
    - FAIR_TRADE
    - BCI
    - GRS
  emission-factors:
    water-liters-per-unit: 2700.0
    energy-kwh-per-unit: 15.5
    co2e-kg-per-unit: 8.3
  storage:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: threadtrace-test
