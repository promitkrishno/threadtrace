services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threadtrace
      POSTGRES_USER: threadtrace
      POSTGRES_PASSWORD: threadtrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadtrace -d threadtrace"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    deploy:
      resources:
        limits:
          memory: 256m

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/threadtrace
      SPRING_DATASOURCE_USERNAME: threadtrace
      SPRING_DATASOURCE_PASSWORD: threadtrace
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: threadtrace
      DB_USERNAME: threadtrace
      DB_PASSWORD: threadtrace
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  pgdata:
  miniodata:
