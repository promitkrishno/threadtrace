services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: threadtrace
      POSTGRES_USER: threadtrace
      POSTGRES_PASSWORD: threadtrace
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadtrace -d threadtrace"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/threadtrace
      SPRING_DATASOURCE_USERNAME: threadtrace
      SPRING_DATASOURCE_PASSWORD: threadtrace
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_ENABLED: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: threadtrace
      DB_USERNAME: threadtrace
      DB_PASSWORD: threadtrace
      STORAGE_TYPE: local
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  pgdata: